[program:caller-llm]
command=/workspace/caller/deploy/gpu-node/run/llm.sh
directory=/workspace/caller
autostart=true
autorestart=true
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/workspace/caller/logs/llm.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
