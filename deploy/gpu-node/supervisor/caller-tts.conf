[program:caller-tts]
command=/workspace/caller/deploy/gpu-node/run/tts.sh
directory=/workspace/caller
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/workspace/caller/logs/tts.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
