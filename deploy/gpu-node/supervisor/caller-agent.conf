[program:caller-agent]
command=/workspace/caller/deploy/gpu-node/run/agent.sh
directory=/workspace/caller
; Starts manually once LIVEKIT_URL points at the deployed LiveKit server:
;   supervisorctl start caller-agent
autostart=false
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/workspace/caller/logs/agent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
