[general]
static=yes
writeprotect=yes

[from-softphone]
; Dial 100 from the softphone to call LiveKit.
exten => 100,1,NoOp(Softphone -> LiveKit SIP)
 same => n,Dial(PJSIP/100@livekit-out,60)
 same => n,Hangup()

[from-livekit]
; LiveKit's outbound trunk calls "livekit"; ring the registered softphone.
exten => livekit,1,NoOp(LiveKit -> softphone)
 same => n,Dial(PJSIP/1000,60)
 same => n,Hangup()

; Echo test: dial "9999" from LiveKit to answer and hear your own audio back.
; Useful to verify two-way RTP without a registered softphone.
exten => 9999,1,NoOp(LiveKit echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
