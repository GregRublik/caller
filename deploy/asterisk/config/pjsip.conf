; Minimal PJSIP configuration for a local test PBX.
;
; Softphone  --REGISTER-->  Asterisk:5062  --INVITE (IP auth)-->  LiveKit SIP:5060
; LiveKit    --INVITE-->    Asterisk:5062  --Dial-->              softphone
;
; Passwords here are for a throwaway local test and must not be reused.

[global]
type=global
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062

; ---------------- softphone ----------------

[1000]
type=endpoint
context=from-softphone
disallow=all
allow=ulaw,alaw
auth=auth1000
aors=1000
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth1000]
type=auth
auth_type=userpass
username=1000
password=test1234

[1000]
type=aor
max_contacts=1
remove_existing=yes

; ---------------- calls coming from LiveKit ----------------
; LiveKit connects from 127.0.0.1 (same host), so the trunk is identified by
; IP. PJSIP's username identifier matches the From user, which is the caller
; ID ("100"), not "livekit", so an identify section is the reliable way.

[identify-livekit]
type=identify
endpoint=livekit
match=127.0.0.1

[livekit]
type=endpoint
context=from-livekit
disallow=all
allow=ulaw,alaw
direct_media=no

; ---------------- outbound calls to LiveKit SIP ----------------

[livekit-out]
type=endpoint
disallow=all
allow=ulaw,alaw
aors=livekit-out
direct_media=no

[livekit-out]
type=aor
contact=sip:127.0.0.1:5060
