name: caller-llm

services:
  llm:
    # Pin a version for reproducibility, e.g. vllm/vllm-openai:v0.11.0
    image: vllm/vllm-openai:latest
    container_name: caller-llm
    restart: unless-stopped
    ipc: host

    # Bound to localhost: the agent talks to vLLM over HTTP and both usually
    # run on the same host. Change to "0.0.0.0:8000:8000" only if the agent
    # runs elsewhere and the network is trusted.
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      HF_HOME: /models/huggingface
      # Blackwell (RTX PRO 6000) workaround: DeepGEMM crashed for this model.
      VLLM_USE_DEEP_GEMM: ${VLLM_USE_DEEP_GEMM:-0}
      VLLM_MOE_USE_DEEP_GEMM: ${VLLM_MOE_USE_DEEP_GEMM:-0}

    volumes:
      - hf-cache:/models/huggingface

    command:
      - ${LLM_MODEL_ID:-Qwen/Qwen3-14B-FP8}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${LLM_MODEL:-qwen3-14b}
      - --max-model-len
      - ${LLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.40}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --api-key
      - ${VLLM_API_KEY:?VLLM_API_KEY is required}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  hf-cache:
