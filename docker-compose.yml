
services:
  # ------------------------------------------------
  # LLM: Qwen3-14B
  # ------------------------------------------------
  llm:
    image: vllm/vllm-openai:latest
    container_name: sales-llm
    restart: unless-stopped
    ipc: host

    command:
      - ${LLM_MODEL_ID:-Qwen/Qwen3-14B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.55}
      - --served-model-name
      - qwen3-14b
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --api-key
      - ${VLLM_API_KEY}

    environment:
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN}

    volumes:
      - huggingface-cache:/models/huggingface
      - vllm-cache:/root/.cache/vllm

    expose:
      - "8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # ------------------------------------------------
  # STT: GigaAM-v3
  # ------------------------------------------------
  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    container_name: sales-stt
    restart: unless-stopped

    environment:
      STT_MODEL_ID: ${STT_MODEL_ID}
      STT_MODEL_REVISION: ${STT_MODEL_REVISION:-e2e_rnnt}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN}
      DEVICE: cuda
      HOST: 0.0.0.0
      PORT: 8001

    volumes:
      - huggingface-cache:/models/huggingface

    expose:
      - "8001"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  # ------------------------------------------------
  # TTS: Qwen3-TTS 0.6B
  # ------------------------------------------------
  tts:
    build:
      context: ./tts
      dockerfile: Dockerfile
    container_name: sales-tts
    restart: unless-stopped

    environment:
      TTS_MODEL_ID: ${TTS_MODEL_ID}
      TTS_SPEAKER: ${TTS_SPEAKER:-Aiden}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-ru}
      TTS_OUTPUT_SAMPLE_RATE: ${TTS_OUTPUT_SAMPLE_RATE:-24000}
      TTS_CHUNK_MS: ${TTS_CHUNK_MS:-100}
      TTS_ATTN_IMPLEMENTATION: ${TTS_ATTN_IMPLEMENTATION:-sdpa}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN}
      DEVICE: cuda
      HOST: 0.0.0.0
      PORT: 8002

    volumes:
      - huggingface-cache:/models/huggingface

    expose:
      - "8002"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  # ------------------------------------------------
  # LiveKit Agent: sales logic + voice pipeline
  # ------------------------------------------------
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: sales-agent
    restart: unless-stopped

    env_file:
      - .env

    environment:
      LLM_BASE_URL: http://llm:8000/v1
      STT_BASE_URL: http://stt:8001
      TTS_BASE_URL: http://tts:8002
      LLM_MODEL: ${LLM_MODEL:-qwen3-14b}
      AGENT_NAME: ${AGENT_NAME:-sales-agent}
      TTS_SPEAKER: ${TTS_SPEAKER:-Aiden}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-ru}
      SIP_OUTBOUND_TRUNK_ID: ${SIP_OUTBOUND_TRUNK_ID:-}
      SIP_ANSWER_TIMEOUT: ${SIP_ANSWER_TIMEOUT:-60}
      HF_HOME: /models/huggingface
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      - huggingface-cache:/models/huggingface

    depends_on:
      llm:
        condition: service_healthy
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy

    command: >
      python main.py start

volumes:
  huggingface-cache:
  vllm-cache:
